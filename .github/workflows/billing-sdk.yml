name: Replay recorded billing SDK calls
on:
  push:
    paths:
      - 'evidence/billing-study/**'
      - 'tools/run_billing_sdk.py'
      - '.github/workflows/billing-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: python -I -S tools/run_billing_sdk.py --execute --workspace "${{ runner.temp }}/billing-sdk-replay" --output billing-sdk-replay.json
