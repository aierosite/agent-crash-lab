name: Reproduce the evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -S tools/verify_release.py --judge
      - run: python -I -S tools/measure_resources.py --output resource-measurements.json
      - run: python -I -S tools/measure_policy_resources.py --output policy-resource-measurements.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node test_report_contract.js
      - run: node test_token_contract.js
      - run: node test_source_contract.js
      - run: node test_event_contract.js
      - run: node test_policy_contract.js
      - run: node test_agent_contract.js
      - run: node test_state_contract.js
      - run: node test_state_bundle_contract.js
      - run: node test_state_cancellation.js
